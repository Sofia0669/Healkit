<div class="app-shell" [class.collapsed]="!menuOpen">
    <aside class="sidebar" [class.mobile-open]="menuOpen">
        <a routerLink="/inicio" class="sidebar-logo" (click)="menuOpen=false">
            <img src="assets/logo-menu.jpg" alt="HEALKIT PHARMACY">
        </a>
        <nav class="sidebar-nav" aria-label="Menú principal">
            <a routerLink="/inicio" routerLinkActive="selected" class="nav-link" (click)="menuOpen=false">
                <hk-icon name="home"/>
                 <span>Inicio</span>
                </a>
                 <a routerLink="/inventario" routerLinkActive="selected" class="nav-link" (click)="menuOpen=false">
                    <hk-icon name="box"/>
                    <span>Inventario</span>
                </a>
                <div class="nav-link upcoming" title="Módulo del compañero">
                    <hk-icon name="cart"/>
                    <span>Ventas</span>
                </div>
                <div class="nav-link upcoming" title="Módulo del compañero">
                    <hk-icon name="users"/>
                    <span>Clientes</span>
                </div>
            </nav>
            <div class="sidebar-bottom">
                <div class="side-rule"></div>
                <div class="nav-link upcoming">
                    <hk-icon name="user"/>
                    <span>Perfil</span>
                </div>
                <a routerLink="/login" class="nav-link">
                    <hk-icon name="logout"/>
                    <span>Cerrar sesión</span>
                </a>
            </div>
        </aside>
        <div class="shell-content">
            <header class="topbar">
                <button type="button" class="menu-button" aria-label="Abrir menú" (click)="toggleMenu()">
                    <hk-icon name="menu"/>
                </button>
                <div class="top-search">
                    <hk-icon name="search"/>
                    <span>Buscar en HealKit...</span>
                </div>
                <div class="top-right">
                    <div class="notification">
                        <hk-icon name="bell"/>
                        <span></span>
                    </div>
                    <div class="avatar">AS</div>
                    <div class="user-details">
                        <strong>Angie Solano</strong>
                        <small>Administrador</small>
                    </div>
                </div>
            </header>
            <main class="shell-page">
                <router-outlet/>
            </main>
        </div>
    </div>
